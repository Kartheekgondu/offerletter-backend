# Offer Letter API - Render configuration
spring.application.name=offerletter

# ---------------------------------------------------------------
# Database (MySQL)
# Set these in Render -> Environment. NEVER put real passwords here.
#   DB_URL      jdbc:mysql://HOST:PORT/DBNAME?sslMode=REQUIRED
#               (mysql://user:pass@HOST:PORT/DBNAME is also accepted;
#                DataSourceConfig adds the missing "jdbc:" prefix)
#   DB_USERNAME MySQL user
#   DB_PASSWORD MySQL password
# SPRING_DATASOURCE_* names are accepted as aliases.
# The localhost default is for local development only.
# The datasource itself is built in config/DataSourceConfig.java
# ---------------------------------------------------------------
app.db.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/offerletter_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
app.db.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
app.db.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# Hibernate / JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Render supplies PORT automatically.
server.port=${PORT:9091}

# CORS and API security
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173}

# Uploaded PDFs. Render's filesystem is ephemeral unless a persistent disk is mounted.
app.upload-dir=${UPLOAD_DIR:uploads}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:9091}

# Email - credentials come ONLY from environment variables
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Multipart PDF upload limit
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
