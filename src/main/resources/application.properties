spring.application.name=offerletter

# Database credentials must be supplied by the hosting provider.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/offerletter_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Kartheek123@}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${PORT:9091}
server.forward-headers-strategy=framework

app.allowed-origins=${APP_ALLOWED_ORIGINS:https://offerletter-frontend.vercel.app,http://localhost:5173}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:9091}
app.upload-dir=${UPLOAD_DIR:uploads}

# Gmail SMTP. Set MAIL_USERNAME and MAIL_PASSWORD in Render.
# MAIL_PASSWORD must be a Google App Password, not the normal Gmail password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:Kartheekgondu123@gmail.com}
spring.mail.password=${MAIL_PASSWORD:uhyukwugiggsdhaq}
app.email.from=${MAIL_FROM:${MAIL_USERNAME:Kartheekgondu123@gmail.com}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
