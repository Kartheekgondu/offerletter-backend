spring.application.name=offerletter

# Keep the existing production database values in Render Environment.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/offerletter_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Kartheek123@}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${PORT:9091}
server.forward-headers-strategy=framework

app.allowed-origins=${APP_ALLOWED_ORIGINS:https://offerletter-frontend.vercel.app,http://localhost:5173}
app.public-base-url=${APP_PUBLIC_BASE_URL:https://offerletter-backend-yh42.onrender.com}
app.upload-dir=${UPLOAD_DIR:uploads}

# Same Gmail SMTP host/port and STARTTLS settings as the supplied Appraisal project.
# Do not hardcode credentials in source control.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:Kartheekgondu123@gmail.com}
spring.mail.password=${MAIL_PASSWORD:uhyukwugiggsdhaq}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
