spring.application.name=offerletter

# MySQL - provide credentials through environment variables
app.db.url=${DB_URL:jdbc:mysql://localhost:3306/offerletter_db}
app.db.username=${DB_USERNAME:root}
app.db.password=${DB_PASSWORD:Kartheek123@}

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Server
server.port=${PORT:9091}
server.forward-headers-strategy=framework

# Frontend CORS origins (comma-separated)
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,https://offerletter-frontend.vercel.app}

# Public backend URL used when saving PDF links
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:9091}

# Uploaded PDFs
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Gmail SMTP - credentials must be set in environment variables
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:Kartheekgondu123@gmail.com}
spring.mail.password=${MAIL_PASSWORD:uhyukwugiggsdhaq}
app.email.from=${MAIL_FROM:${MAIL_USERNAME:Kartheekgondu123@gmail.com}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
