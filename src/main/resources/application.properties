spring.application.name=offerletter

# Database configuration follows the working Appraisal backend pattern.
# Render environment variables:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/offerletter_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Kartheek123@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:9091}
server.forward-headers-strategy=framework

app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,https://offerletter-frontend.vercel.app}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:9091}
app.upload-dir=${UPLOAD_DIR:uploads}

# Gmail SMTP, following Appraisal backend's JavaMailSender pattern.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:Kartheekgondu123@gmail.com}
spring.mail.password=${MAIL_PASSWORD:uhyukwugiggsdhaq}
app.email.from=${MAIL_FROM:${MAIL_USERNAME:Kartheekgondu123@gmail.com}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
